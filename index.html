<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LifeQuest</title>
  <meta name="description" content="Track chores, workouts, sleep, steps and weight — and level up for showing up.">
  <meta name="theme-color" content="#2a78d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeQuest">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today" class="active"><span aria-hidden="true">✅</span>Today</button>
    <button data-tab="dash"><span aria-hidden="true">📈</span>Dashboard</button>
    <button data-tab="rewards"><span aria-hidden="true">🏆</span>Rewards</button>
    <button data-tab="settings"><span aria-hidden="true">⚙️</span>Settings</button>
  </nav>

  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
